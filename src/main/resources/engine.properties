# ============================================================
# Engine Configuration
# ============================================================
# 주석은 '#' 또는 '!' 로 시작합니다.
# 값 뒤 공백은 무시됩니다. 색상은 R,G,B 로 콤마 구분합니다.
# ============================================================

# ---------- Window ----------
window.width  = 1920
window.height = 1080
window.title  = 3D Engine - Shadows & Slime Integrated
window.swapInterval = 1

# ---------- Engine ----------
engine.dtClamp     = 0.05
engine.glslVersion = #version 120

# ---------- Render ----------
