render.colorGround        = 0.50, 0.50, 0.50
render.colorGrid          = 0.00, 0.00, 0.00
render.colorPlayerGround  = 0.20, 0.90, 1.00
render.colorPlayerAir     = 0.10, 0.60, 1.00
render.colorBlock         = 0.95, 0.50, 0.20
