plugins {
    id 'java'
}

repositories {
    mavenCentral() // 라이브러리를 다운로드할 중앙 저장소
}

dependencies {
    // LWJGL 버전 관리 (BOM)
    implementation platform("org.lwjgl:lwjgl-bom:3.3.3")

    // 필요한 LWJGL 모듈
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation 'org.joml:joml:1.10.8'
    implementation 'io.github.spair:imgui-java-binding:1.86.11'
    implementation 'io.github.spair:imgui-java-lwjgl3:1.86.11'

    // OS별 Native 라이브러리 (필요 시 자동으로 로드됨)
    implementation 'io.github.spair:imgui-java-natives-linux:1.86.11' // Linux 환경

    // OS별 네이티브 바이너리 (linux 기준)
    runtimeOnly "org.lwjgl:lwjgl::natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-glfw::natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-opengl::natives-linux"
}